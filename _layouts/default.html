<!doctype html>
<html lang="en" data-theme="{{ site.colorscheme | default: 'tokyonight' }}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta name="theme-color" content="#15161e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml" />
    <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    {% seo title=false %}
  </head>

  <body>
    <div class="vim-frame">
      {% include winbar.html path=page.path_label %}
      {% include tabline.html active=page.tab_active extra=page.tab_extra %}

      <div class="buffer">
        {{ content }}
      </div>

      {% include lualine.html filename=page.filename sections=page.sections filetype=page.filetype position=page.position percent=page.percent %}
    </div>
  </body>
</html>
